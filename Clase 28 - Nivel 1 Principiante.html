<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 28 · Principiante</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#166534;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

:"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: 3x − 7 ≥ 3 3x ≥ 3 − 7\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x − 7 ≥ 3<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x ≥ 3 − 7<\/text><\/svg>","o":["Al pasar −b al otro lado no cambió su signo: debió sumarse, quedando ax ≥ a + b","Dividió por el coeficiente antes de mover el término numérico de lugar","Cambió el sentido de la desigualdad al pasar el término numérico","Restó el coeficiente de x a ambos lados de la inecuación completa","Multiplicó el término numérico por menos uno solo en el lado izquierdo"],"s":"Argumentar","e":"Al pasar −b al otro lado no cambió su signo: debió sumarse, quedando ax ≥ a + b."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 148\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: (x + 3)² = (x + 3)(x + 3) = x² + 3x + 3\"><rect width=\"560\" height=\"148\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"98.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.7\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"97.3\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(x + 3)² = (x + 3)(x + 3) = x² + 3x + 3<\/text><\/svg>","o":["Multiplicó cada término solo una vez: al distribuir aparecen dos términos 3x y un término 9","Distribuyó bien los términos pero sumó los dos productos cruzados como uno solo","Multiplicó solo los términos de la primera posición de cada binomio entre sí","Elevó al cuadrado el segundo término pero lo dejó fuera del resultado final","Sumó los dos binomios en lugar de multiplicarlos entre sí para desarrollarlos"],"s":"Argumentar","e":"Multiplicó cada término solo una vez: al distribuir aparecen dos términos 3x y un término 9."},{"q":"¿Cuál es el conjunto solución de la ecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve la ecuación: (x + 4)(x + 6) = 0\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resuelve la ecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(x + 4)(x + 6) = 0<\/text><\/svg>","o":["x = −6 y x = −4","x = 4 y x = 6","x = −4 y x = 6","x = −6 y x = 4","x = −6 y x = −3"],"s":"Resolver problemas","e":"Las soluciones son x = −4 y x = −6."},{"q":"Sea f(x) = 2x² + x + 3. ¿Cuál es el valor de f(−3)?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Función: f(x) = 2x² + x + 3\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Función:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = 2x² + x + 3<\/text><\/svg>","o":["18","−18","24","22","36"],"s":"Resolver problemas","e":"f(−3) = 2·(−3)² + (1)·(−3) + (3) = 18."},{"q":"Con un presupuesto de $15.000 se compra una matrícula de $5.000 y se quieren comprar clases de $1.000 cada una. ¿Cuál es la mayor cantidad de clases que se puede comprar?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Presupuesto: $15.000 Matrícula: $5.000 (una vez) Cada clase: $1.000\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Presupuesto: $15.000<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Matrícula: $5.000 (una vez)<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Cada clase: $1.000<\/text><\/svg>","o":["10","11","9","15","20"],"s":"Modelar","e":"5000 + 1000n ≤ 15000 ⟹ n ≤ 10; el mayor entero es 10."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: f(x) = 2x² − 24x + 5 Vértice en x = −b/a = 12\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = 2x² − 24x + 5<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Vértice en x = −b/a = 12<\/text><\/svg>","o":["Usó −b/a en lugar de −b/(2a): la coordenada x del vértice es 6","Dividió el coeficiente lineal por el término independiente en vez de por 2a","Cambió el signo del coeficiente lineal pero dividió por el coeficiente equivocado","Calculó bien la fórmula pero reemplazó b por el término independiente","Usó la fórmula de las raíces en lugar de la del vértice de la parábola"],"s":"Argumentar","e":"Usó −b/a en lugar de −b/(2a): la coordenada x del vértice es 6."},{"q":"¿Cuál es el conjunto solución de la inecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve la inecuación: 5x − 4 &gt; 36\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resuelve la inecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">5x − 4 &gt; 36<\/text><\/svg>","o":["x > 8","x < 8","x > −8","x > 32/5","x < −8"],"s":"Resolver problemas","e":"Se despeja x dividiendo por su coeficiente: si es negativo, se invierte el sentido de la desigualdad."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: Dos planes con pendientes 200 y 300 El de pendiente menor siempre es más barato\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Dos planes con pendientes 200 y 300<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">El de pendiente menor siempre es más barato<\/text><\/svg>","o":["No consideró el cargo fijo: un plan de menor pendiente puede ser más caro para poco uso","Consideró que la pendiente menor implica un cargo fijo mayor en todos los casos","Comparó los costos solo cuando el uso es cero y concluyó con ese valor","Supuso que ambas rectas se cruzan siempre en el origen del plano cartesiano","Comparó las pendientes pero olvidó que el costo depende también de n"],"s":"Argumentar","e":"No consideró el cargo fijo: un plan de menor pendiente puede ser más caro para poco uso."},{"q":"Se reparten $15.100 entre Ana, Bruno y Carla. Bruno recibe $2.300 más que Ana y Carla recibe el doble de lo que recibe Ana. Sea x lo que recibe Ana. ¿Qué ecuación permite calcular el valor de x?","svg":"<svg viewBox=\"0 0 560 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Total: $15.100 Ana: x  ·  Bruno: x + 2300 Carla: 2x\"><rect width=\"560\" height=\"180\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"130.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Total: $15.100<\/text><text x=\"280.0\" y=\"97.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ana: x  ·  Bruno: x + 2300<\/text><text x=\"280.0\" y=\"129.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Carla: 2x<\/text><\/svg>","o":["x + (x + 2300) + 2x = 15100","x + x + 2300 + 2x = 15100 · 2","x · (x + 2300) · 2x = 15100","x + (x + 2300) + x + 2 = 15100","x + (x + 2300) + 2(x + 2300) = 15100"],"s":"Modelar","e":"Se traduce cada frase del enunciado a una expresión con x y se iguala al dato total."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: 2x + y = 7 x + y = 4 Restando: 2x − x + y − y = 7 + 4 → x = 11\"><rect width=\"560\" height=\"220\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"170.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"66.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"100.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x + y = 7<\/text><text x=\"280.0\" y=\"134.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x + y = 4<\/text><text x=\"280.0\" y=\"168.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Restando: 2x − x + y − y = 7 + 4 → x = 11<\/text><\/svg>","o":["Al restar las ecuaciones sumó los lados derechos: debió calcular 7 − 4 = 3","Sumó las ecuaciones en lugar de restarlas antes de eliminar la incógnita","Eliminó la incógnita x en lugar de la incógnita y en el sistema completo","Multiplicó una de las ecuaciones por dos antes de operar con la otra","Despejó y de la primera ecuación y la reemplazó en la misma ecuación"],"s":"Argumentar","e":"Al restar las ecuaciones sumó los lados derechos: debió calcular 7 − 4 = 3."},{"q":"¿Qué tipo de función representa el gráfico y por qué?","svg":"<svg viewBox=\"0 0 560 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gráfico de una función\"><rect width=\"560\" height=\"300\" fill=\"#FFFFFF\"/><line x1=\"44.0\" y1=\"270.0\" x2=\"44.0\" y2=\"14.0\" stroke=\"#CBD5E1\" stroke-width=\"1\"/><text x=\"44.0\" y=\"292.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−6<\/text><line x1=\"127.7\" y1=\"270.0\" x2=\"127.7\" y2=\"14.0\" stroke=\"#CBD5E1\" stroke-width=\"1\"/><text x=\"127.7\" y=\"292.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−4<\/text><line x1=\"211.3\" y1=\"270.0\" x2=\"211.3\" y2=\"14.0\" stroke=\"#CBD5E1\" stroke-width=\"1\"/><text x=\"211.3\" y=\"292.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−2<\/text><line x1=\"295.0\" y1=\"270.0\" x2=\"295.0\" y2=\"14.0\" stroke=\"#CBD5E1\" stroke-width=\"1\"/><text x=\"295.0\" y=\"292.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">0<\/text><line x1=\"378.7\" y1=\"270.0\" x2=\"378.7\" y2=\"14.0\" stroke=\"#CBD5E1\" stroke-width=\"1\"/><text x=\"378.7\" y=\"292.0\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2<\/text><line x1=\"462.3\" y1=\"270.0\" x2=\"462.3\" y2=\"1 actor común: se puede factorizar 14 y queda 14(x + 2)","Extrajo un factor que no divide a ninguno de los dos términos de la expresión","Extrajo el factor común pero dejó los términos sin dividir por él","Factorizó la variable x pero no el coeficiente numérico común de los términos","Sumó los coeficientes en lugar de buscar su máximo divisor común"],"s":"Argumentar","e":"No extrajo el máximo factor común: se puede factorizar 14 y queda 14(x + 2)."},{"q":"¿Cuál es el conjunto solución de la ecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve la ecuación: (x − 7)(x + 3) = 0\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resuelve la ecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(x − 7)(x + 3) = 0<\/text><\/svg>","o":["x = −3 y x = 7","x = −7 y x = 3","x = 3 y x = 7","x = −7 y x = −3","x = −3 y x = 8"],"s":"Resolver problemas","e":"Las soluciones son x = 7 y x = −3."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: f(x) = x² + 7x f(−3) = −9 − 21\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = x² + 7x<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(−3) = −9 − 21<\/text><\/svg>","o":["Elevó al cuadrado solo el número 3 y no el signo: (−3)² = 9, no −9","Reemplazó x por 3 en lugar de reemplazarlo por −3 en ambos términos","Multiplicó el valor por el exponente en vez de elevarlo al cuadrado","Sumó el exponente al valor en lugar de elevar la base al cuadrado","Cambió el signo del término lineal pero no el del término cuadrático"],"s":"Argumentar","e":"Elevó al cuadrado solo el número 3 y no el signo: (−3)² = 9, no −9."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: (x − 5)(x + 3) = 0 x = −5  o  x = 3\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(x − 5)(x + 3) = 0<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x = −5  o  x = 3<\/text><\/svg>","o":["Cambió el signo de las dos soluciones: (x − a)(x + b) = 0 tiene soluciones x = a y x = −b","Igualó a cero solo el primer factor y descartó la solución del segundo","Sumó los números de los factores para obtener una única solución","Multiplicó los números de los factores para obtener las solucio D6E\" stroke-width=\"3\"/><rect x=\"242.2\" y=\"164.0\" width=\"75.5\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"183.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x + 6<\/text><rect x=\"332.2\" y=\"76.0\" width=\"75.5\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"370.0\" y=\"95.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x + 1<\/text><rect x=\"132.2\" y=\"76.0\" width=\"75.5\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"170.0\" y=\"95.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x − 1<\/text><\/svg>","o":["7x + 6","7x + 8","12x + 6","8x + 6","7x"],"s":"Modelar","e":"Perímetro = suma de los tres lados; se reducen los términos semejantes."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: x + y = 8 x − y = 2 Sumando: 2x = 6 → x = 3;  y = 8 + 3 = 11\"><rect width=\"560\" height=\"220\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"170.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"66.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"100.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x + y = 8<\/text><text x=\"280.0\" y=\"134.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x − y = 2<\/text><text x=\"280.0\" y=\"168.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sumando: 2x = 6 → x = 3;  y = 8 + 3 = 11<\/text><\/svg>","o":["Sustituyó mal: debió reemplazar x = 3 en la primera ecuación y obtener y = 5","Sumó las ecuaciones pero no dividió el resultado por el coeficiente de x","Restó las ecuaciones en lugar de sumarlas y por eso obtuvo un valor equivocado","Despejó y de la segunda ecuación pero cambió el signo del término x","Comprobó el valor de x pero no lo reemplazó en ninguna de las ecuaciones"],"s":"Argumentar","e":"Sustituyó mal: debió reemplazar x = 3 en la primera ecuación y obtener y = 5."},{"q":"¿Qué tipo de modelo (lineal o cuadrático) describe mejor la situación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Situación: El área de un cuadrado según la medida de su lado\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Situación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">El área de un cuadrado según la medida de su lado<\/text><\/svg>","o":["Cuadrática, porque el área depende del cuadrado del lado","Lineal, porque el área depende del cuadrado del lado","Lineal, porque la situación involucra dos variables","Cuadrática, porque siempre se cumple que a mayor valor de x mayor valor de y","Ninguno, porque la situación no puede modelarse con una función"],"s":"Argumentar","e":"Se decide según cómo cambia la cantidad dependiente: variación constante (lineal) o dependencia del cuadrado (cuadrática)."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: y = 4x + 5 «La recta corta al eje X en 5»\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">y = 4x + 5<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">«La recta corta al eje X en 5»<\/text><\/svg>","o":["El punto (0, 5) es el corte con el eje Y: el corte con el eje X se obtiene haciendo y = 0","El corte con el eje X es 4, porque es el coeficiente de x en la ecuación","La recta corta al eje X en −5, porque se cambia el signo del término independiente","La recta no corta al eje X porque tiene pendiente positiva en toda su extensión","El corte con el eje X es 20, porque se multiplica la pendiente por n"],"s":"Argumentar","e":"El punto (0, 5) es el corte con el eje Y: el corte con el eje X se obtiene haciendo y = 0."},{"q":"Un cliente afirma: «El plan B siempre conviene, porque su precio por unidad es menor». ¿Es correcta la afirmación?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $100 + $500 por unidad Plan B: $700 + $300 por unidad\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan A: $100 + $500 por unidad<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan B: $700 + $300 por unidad<\/text><\/svg>","o":["No: el plan A es más barato con menos de 3 unidades, porque su costo fijo es menor","Sí: el plan B es más barato con cualquier cantidad de unidades usadas","No: el plan A es más barato con más de 3 unidades, porque su precio por unidad es menor","Sí: con 3 unidades el plan B es más barato que el plan A","No: ambos planes cuestan lo mismo con cualquier cantidad de unidades"],"s":"Argumentar","e":"Los planes cuestan lo mismo con 3 unidades; antes conviene A (menor costo fijo) y después B (menor precio por unidad)."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: f(x) = x² + 9x f(−3) = −9 − 27\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = x² + 9x<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(−3) = −9 − 27<\/text><\/svg>","o":["Elevó al cuadrado solo el número 3 y no el signo: (−3)² = 9, no −9","Reemplazó x por 3 en lugar de reemplazarlo por −3 en ambos términos","Multiplicó el valor por el exponente en vez de elevarlo al cuadrado","Sumó el exponente al valor en lugar de elevar la base al cuadrado","Cambió el signo del término lineal pero no el del término cuadrático"],"s":"Argumentar","e":"Elevó al cuadrado solo el número 3 y no el signo: (−3)² = 9, no −9."},{"q":"La tabla muestra los valores de una función f de la forma f(x) = ax + b. ¿Cuál es la expresión de f?","svg":"<svg viewBox=\"0 0 560 144\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Tabla\"><rect width=\"560\" height=\"144\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"30.0\" width=\"500.0\" height=\"42.0\" fill=\"#E0F2FE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"65.7\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x<\/text><text x=\"137.1\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−2<\/text><text x=\"208.6\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−1<\/text><text x=\"280.0\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">0<\/text><text x=\"351.4\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">1<\/text><text x=\"422.9\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2<\/text><text x=\"494.3\" y=\"57.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3<\/text><rect x=\"30.0\" y=\"72.0\" width=\"500.0\" height=\"42.0\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"65.7\" y=\"99.3\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x)<\/text><text x=\"137.1\" const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);
    if(!run&&Math.max(...cnt)<=Math.ceil(CFG.n/5)+1)return qs;
  }
  return pick().map(prepare);
}
let Q,idx,score,answers,t0,timer;
const $=id=>document.getElementById(id);
function start(){
  Q=build();idx=0;score=0;answers=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("meta").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"  ·  "+Math.min(idx+1,Q.length)+"/"+Q.length}
function render(){
  tick();$("bar").style.width=(idx/Q.length*100)+"%";
  const q=Q[idx],app=$("app");
  app.innerHTML="";
  const sk=document.createElement("span");sk.className="skill";sk.textContent="Habilidad: "+q.s;app.append(sk);
  const st=document.createElement("div");st.className="stem";st.textContent=(idx+1)+". "+q.q;app.append(st);
  if(q.svg){const f=document.createElement("div");f.className="fig";f.innerHTML=q.svg;app.append(f)}
  const box=document.createElement("div");box.className="opts";
  q.ord.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const l=document.createElement("b");l.textContent="ABCDE"[i];const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>answer(i,box,b);box.append(b);
  });
  app.append(box);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";app.append(fb);
}
function answer(i,box,btn){
  const q=Q[idx],good=q.ord.indexOf(0),ok=i===good;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(ok)score++;answers.push({q,ok,pick:i});
  const fb=$("fb");fb.style.display="block";
  fb.innerHTML="";const h=document.createElement("b");h.className=ok?"tag-ok":"tag-bad";h.textContent=ok?"¡Correcto! ":"Incorrecto. ";
  fb.append(h,document.createTextNode(q.e));
  const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=idx===Q.length-1?"Ver resultados":"Siguiente →";
  nx.onclick=()=>{idx++;idx>=Q.length?finish():render()};$("app").append(nx);nx.focus();
}
function finish(){
  clearInterval(timer);$("bar").style.width="100%";
  const s=Math.floor((Date.now()-t0)/1000),app=$("app");
  const by={};SKILLS.forEach(k=>by[k]=[0,0]);answers.forEach(a=>{by[a.q.s][1]++;if(a.ok)by[a.q.s][0]++});
  app.innerHTML="";
  const h=document.createElement("div");h.innerHTML='<div class="big"></div><p></p>';
  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
