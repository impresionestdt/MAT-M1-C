<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 28 · Avanzado</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#1D4ED8;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

ndiente de la primera ecuación","Reemplazó y en la primera ecuación en vez de hacerlo en la segunda ecuación","Multiplicó la segunda ecuación por 2 antes de reemplazar el valor de y","Sumó 3x y 2x y obtuvo un coeficiente que no corresponde a la suma"],"s":"Argumentar","e":"Al pasar el 1 al otro lado no cambió su signo: 5x = 11 − 1 = 10, luego x = 2."},{"q":"¿Cuál es la forma reducida de la expresión de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Reduce la expresión: (−4x² − 2x + 6) − (7x² + 5x + 2)\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Reduce la expresión:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(−4x² − 2x + 6) − (7x² + 5x + 2)<\/text><\/svg>","o":["−11x² − 7x + 4","3x² + 3x + 8","−11x² + 3x + 8","6x² − 7x + 4","11x² + 7x − 4"],"s":"Resolver problemas","e":"Se eliminan paréntesis cuidando los signos (menos delante cambia todos los signos) y se suman los términos semejantes."},{"q":"Sea f(x) = −3x² + 4x − 3. ¿Cuál es el valor de f(−1)?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Función: f(x) = −3x² + 4x − 3\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Función:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\" $2.200 y costo B = $2.300 con 3 unidades: conviene el plan A."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: y = 4x + 6 e y = 4x − 6 Las rectas se cortan en un punto porque son distintas\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">y = 4x + 6 e y = 4x − 6<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Las rectas se cortan en un punto porque son distintas<\/text><\/svg>","o":["Tienen la misma pendiente: son paralelas, no se cortan, aunque sus interceptos sean distintos","Tienen pendientes opuestas, por lo que son perpendiculares entre sí siempre","Tienen el mismo intercepto, por lo que se cortan en el eje vertical siempre","Tienen distinta pendiente porque sus términos independientes son distintos entre sí","Son la misma recta porque tienen el mismo coeficiente de x"],"s":"Argumentar","e":"Tienen la misma pendiente: son paralelas, no se cortan, aunque sus interceptos sean distintos."},{"q":"¿Cuál es la solución de la ecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve la ecuación: 7t − 1 = −t + 63\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resuelve la ecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">7t − 1 = −t + 63<\/text><\/svg>","o":["8","31/4","32/3","−31/4","63/8"],"s":"Resolver problemas","e":"Se aíslan los términos con t y se divide por su coeficiente: t = 8."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 236\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: f(x) = −x² + 5 «Abre hacia arriba porque el término independiente es positivo»\"><rect width=\"560\" height=\"236\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"186.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"69.2\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"106.4\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = −x² + 5<\/text><text x=\"280.0\" y=\"143.6\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">«Abre hacia arriba porque el término<\/text><text x=\"280.0\" y=\"180.8\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">independiente es positivo»<\/text><\/svg>","o":["La concavidad depende del coeficiente de x², que aquí es −1: la parábola abre hacia abajo","La parábola abre hacia arriba porque el coeficiente del término lineal es cero","La concavidad depende del término independiente, por lo que abre hacia arriba","La parábola no tiene concavidad porque solo tiene dos términos en su ecuación","La parábola abre hacia abajo porque el término independiente es positivo"],"s":"Argumentar","e":"La concavidad depende del coeficiente de x², que aquí es −1: la parábola abre hacia abajo."},{"q":"La ganancia de una empresa (en miles de pesos) al producir x unidades es G(x) = −x² + 16x + 12. ¿Cuántas unidades debe producir para maximizar su ganancia?","svg":"<svg viewBox=\"0 0 560 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ganancia en función de las unidades x: G(x) = −x² + 16x + 12\"><rect width=\"560\" height=\"150\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"100.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"65.3\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ganancia en función de las unidades x:<\/text><text x=\"280.0\" y=\"98.7\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">G(x) = −x² + 16x + 12<\/text><\/svg>","o":["8","16","9","76","7"],"s":"Modelar","e":"x = −b/(2a) = 8."},{"q":"Para un plan de telefonía se comparan dos planes: el A cobra $2.000 más $150 por min y el B cobra $1.000 más $200 por min. Con un uso de 26 minutos al mes, ¿qué plan conviene y cuánto se ahorra?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $2.000 + $150 por min Plan B: $1.000 + $200 por min Uso mensual estimado: 26 minutos\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan A: $2.000 + $150 por min<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"mi \/text><text x=\"280.0\" y=\"97.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x² − 4 = (x − 2)²<\/text><\/svg>","o":["Usó el cuadrado de binomio: una diferencia de cuadrados se factoriza como (x + a)(x − a)","Factorizó bien pero cambió el signo de uno de los dos factores binomiales","Extrajo el factor común x y dejó el término numérico sin factorizar","Dividió el término numérico por dos en lugar de sacarle raíz cuadrada","Sumó los cuadrados en vez de restarlos al factorizar la expresión"],"s":"Argumentar","e":"Usó el cuadrado de binomio: una diferencia de cuadrados se factoriza como (x + a)(x − a)."},{"q":"La balanza de la figura está en equilibrio y las expresiones indican el peso de cada platillo en gramos. ¿Cuánto vale x?","svg":"<svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Balanza en equilibrio\"><rect width=\"560\" height=\"220\" fill=\"#FFFFFF\"/><line x1=\"280.0\" y1=\"190.0\" x2=\"280.0\" y2=\"110.0\" stroke=\"#0F172A\" stroke-width=\"5\"/><polygon points=\"250.0,200.0 310.0,200.0 280.0,170.0\" fill=\"#0B3D6E\" stroke=\"#0B3D6E\" stroke-width=\"2\"/><line x1=\"120.0\" y1=\"110.0\" x2=\"440.0\" y2=\"110.0\" stroke=\"#0F172A\" stroke-width=\"5\"/><rect x=\"70.0\" y=\"100.0\" width=\"160.0\" height=\"30.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"330.0\" y=\"100.0\" width=\"160.0\" height=\"30.0\" fill=\"#FEF3C7\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"106.7\" y=\"64.5\" width=\"86.7\" height=\"31\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"150.0\" y=\"86.7\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">5x + 9<\/text><rect x=\"366.7\" y=\"64.5\" width=\"86.7\" height=\"31\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"410.0\" y=\"86.7\" font-size=\"19\" font-weig 0.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan A: $600 + $500 por unidad<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan B: $1.500 + $200 por unidad<\/text><\/svg>","o":["No: el plan A es más barato con menos de 3 unidades, porque su costo fijo es menor","Sí: el plan B es más barato con cualquier cantidad de unidades usadas","No: el plan A es más barato con más de 3 unidades, porque su precio por unidad es menor","Sí: con 3 unidades el plan B es más barato que el plan A","No: ambos planes cuestan lo mismo con cualquier cantidad de unidades"],"s":"Argumentar","e":"Los planes cuestan lo mismo con 3 unidades; antes conviene A (menor costo fijo) y después B (menor precio por unidad)."},{"q":"Dos trenes salen a la vez de dos ciudades separadas 160 km, uno hacia el otro, a 30 km/h y 50 km/h. Se encuentran después de x horas. ¿Qué ecuación permite calcular el valor de x?","svg":"<svg viewBox=\"0 0 560 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Distancia entre ciudades: 160 km Velocidades: 30 y 50 km/h Se encuentran en x horas\"><rect width=\"560\" height=\"180\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"130.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Distancia entre ciudades: 160 km<\/text><text x=\"280.0\" y=\"97.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Velocidades: 30 y 50 km/h<\/text><text x=\"280.0\" y=\"129.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Se encuentran en x horas<\/text><\/svg>","o":["30x + 50x = 160","30x − 50x = 160","1500x = 160","30x + 50 = 160","(30 + 50) : x = 160"],"s":"Modelar","e":"Se traduce cada frase del enunciado a una expresión con x y se iguala al dato total."},{"q":"¿Qué tipo de modelo (lineal o cuadrático) describe mejor la situación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Situación: La distancia recorrida a rapidez constante según el tiempo\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Situación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">La distancia recorrida a rapidez constante según el tiempo<\/text><\/svg>","o":["Lineal, porque la distancia aumenta lo mismo en cada segundo","Cuadrática, porque la distancia aumenta lo mismo en cada segundo","Cuadrática, porque la situación involucra dos variables","Lineal, porque siempre se cumple que a mayor valor de x mayor valor de y","Ninguno, porque la situación no puede modelarse con una función"],"s":"Argumentar","e":"Se decide según cómo cambia la cantidad dependiente: variación constante (lineal) o dependencia del cuadrado (cuadrática)."},{"q":"La suma de 3 números impares consecutivos es 63. El menor de ellos es x. ¿Qué ecuación permite calcular el valor de x?","svg":"<svg viewBox=\"0 0 560 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"3 números impares consecutivos Menor = x; los demás suman 2 más cada vez Suma = 63\"><rect width=\"560\" height=\"180\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"13 mente la función pero cambió la variable por otra letra"],"s":"Argumentar","e":"Intercambió el cargo fijo y el costo por unidad: el costo por unidad multiplica a n."},{"q":"Los lados de un triángulo miden las expresiones de la figura. ¿Cuál es su perímetro?","svg":"<svg viewBox=\"0 0 560 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Triángulo con lados expresados algebraicamente\"><rect width=\"560\" height=\"200\" fill=\"#FFFFFF\"/><polygon points=\"120.0,160.0 440.0,160.0 250.0,30.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"242.2\" y=\"164.0\" width=\"75.5\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"183.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">3x + 6<\/text><rect x=\"332.2\" y=\"76.0\" width=\"75.5\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"370.0\" y=\"95.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4x + 5<\/text><rect x=\"132.2\" y=\"76.0\" width=\"75.5\" height=\"28\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"170.0\" y=\"95.6\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4x + 6<\/text><\/svg>","o":["11x + 17","48x + 17","11x + 19","12x + 17","11x"],"s":"Modelar","e":"Perímetro = suma de los tres lados; se reducen los términos semejantes."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 236\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: f(x) = 2x² − 24x + 5 «Tiene un máximo porque el término independiente es positivo»\"><rect width=\"560\" height=\"236\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"186.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"69.2\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"106.4\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = 2x² − 24x + 5<\/text><text x=\"280.0\" y=\"143.6\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">«Tiene un máximo porque el término<\/text><text x=\"280.0\" y=\"180.8\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">independiente es positivo»<\/text><\/svg>","o":["Como a > 0 la parábola abre hacia arriba: tiene un mínimo, no un máximo","Tiene un máximo porque el vértice es el punto más alto de toda parábola","Tiene un máximo porque el coeficiente lineal es negativo en la ecuación","No tiene ni máximo ni mínimo porque abre hacia los dos lados del eje","Tiene un mínimo pero solo si el término independiente es negativo"],"s":"Argumentar","e":"Como a > 0 la parábola abre hacia arriba: tiene un mínimo, no un máximo."},{"q":"La ganancia de una empresa (en miles de pesos) al producir x unidades es G(x) = −3x² + 90x − 562. ¿Cuántas unidades debe producir para maximizar su ganancia?","svg":"<svg viewBox=\"0 0 560 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ganancia en función de las unidades x: G(x) = −3x² + 90x − 562\"><rect width=\"560\" height=\"150\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"100.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"65.3\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Ganancia en función de las unidades x:<\/text><text x=\"280.0\" y=\"98.7\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">G(x) = −3x² + 90x − 562<\/text><\/svg>","o":["15","90","30","16","113"],"s":"Modelar","e":"x = −b/(2a) = 15."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: f(x) = −x² + 8x «El valor máximo es 4, porque el vértice está en x = 4»\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = −x² + 8x<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">«El valor máximo es 4, porque el vértice está en x = 4»<\/text><\/svg>","o":["Confundió la coordenada x con el valor máximo: el máximo es f(4) = 16","El valor máximo es el coeficiente lineal de la función, que es 8","El valor máximo es el término independiente, que en este caso es cero","El valor máximo es la abscisa del vértice dividida por dos","El valor máximo se obtiene reemplazando x = 0 en la función cuadrática"],"s":"Argumentar","e":"Confundió la coordenada x con el valor máximo: el máximo es f(4) = 16."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: C(n) = 2000 + 500n C(9) = (2000 + 500)·9 = 22500\"><rect width=\"560\" height=\"192\" fill=\"#FFFFF const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);
    if(!run&&Math.max(...cnt)<=Math.ceil(CFG.n/5)+1)return qs;
  }
  return pick().map(prepare);
}
let Q,idx,score,answers,t0,timer;
const $=id=>document.getElementById(id);
function start(){
  Q=build();idx=0;score=0;answers=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("meta").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"  ·  "+Math.min(idx+1,Q.length)+"/"+Q.length}
function render(){
  tick();$("bar").style.width=(idx/Q.length*100)+"%";
  const q=Q[idx],app=$("app");
  app.innerHTML="";
  const sk=document.createElement("span");sk.className="skill";sk.textContent="Habilidad: "+q.s;app.append(sk);
  const st=document.createElement("div");st.className="stem";st.textContent=(idx+1)+". "+q.q;app.append(st);
  if(q.svg){const f=document.createElement("div");f.className="fig";f.innerHTML=q.svg;app.append(f)}
  const box=document.createElement("div");box.className="opts";
  q.ord.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const l=document.createElement("b");l.textContent="ABCDE"[i];const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>answer(i,box,b);box.append(b);
  });
  app.append(box);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";app.append(fb);
}
function answer(i,box,btn){
  const q=Q[idx],good=q.ord.indexOf(0),ok=i===good;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(ok)score++;answers.push({q,ok,pick:i});
  const fb=$("fb");fb.style.display="block";
  fb.innerHTML="";const h=document.createElement("b");h.className=ok?"tag-ok":"tag-bad";h.textContent=ok?"¡Correcto! ":"Incorrecto. ";
  fb.append(h,document.createTextNode(q.e));
  const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=idx===Q.length-1?"Ver resultados":"Siguiente →";
  nx.onclick=()=>{idx++;idx>=Q.length?finish():render()};$("app").append(nx);nx.focus();
}
function finish(){
  clearInterval(timer);$("bar").style.width="100%";
  const s=Math.floor((Date.now()-t0)/1000),app=$("app");
  const by={};SKILLS.forEach(k=>by[k]=[0,0]);answers.forEach(a=>{by[a.q.s][1]++;if(a.ok)by[a.q.s][0]++});
  app.innerHTML="";
  const h=document.createElement("div");h.innerHTML='<div class="big"></div><p></p>';
  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
</script>
