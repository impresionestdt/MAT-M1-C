<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 · Clase 28 · Experto</title>
<style>
:root{--primary:#4B2363;--accent:#B37D48;--level:#9F1239;--ink:#0F172A;--bg:#F8FAFC;--card:#fff;--ok:#166534;--bad:#991B1B;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:#fff;border-top:6px solid var(--primary);border-bottom:5px solid var(--level);display:flex;align-items:center;gap:16px;padding:8px 16px;flex-wrap:wrap}
.logo{height:92px;width:auto;flex:0 0 auto}
.logo img{height:100%;width:auto;display:block}
@media(max-width:640px){header{position:static}.logo{height:80px}}
.badge{background:var(--level);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px}
.meta{margin-left:auto;font-weight:700;font-size:15px}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:4px 0 16px}
.bar>i{display:block;height:100%;background:var(--level);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.skill{display:inline-block;background:#E0E7FF;color:#1E1B4B;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.stem{font-size:19px;font-weight:600;margin:4px 0 12px}
.fig{border:2px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px;background:#fff}
.fig svg{display:block;width:100%;height:auto;max-height:340px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--level)}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--level);color:#fff;display:grid;place-items:center;font-size:15px}
.opt.ok{border-color:var(--ok);background:#DCFCE7}
.opt.bad{border-color:var(--bad);background:#FEE2E2}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:10px;background:#F1F5F9;border-left:6px solid var(--level);display:none}
.btn{background:var(--level);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
.big{font-size:44px;font-weight:900;color:var(--level)}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tag-ok{color:var(--ok);font-weight:800}.tag-bad{color:var(--bad);font-weight:800}
</style>
</head>

tar","e":"No consideró el cargo fijo: un plan de menor pendiente puede ser más caro para poco uso."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: 2x + y = 7 x + y = 4 Restando: 2x − x + y − y = 7 + 4 → x = 11\"><rect width=\"560\" height=\"220\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"170.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"66.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"100.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">2x + y = 7<\/text><text x=\"280.0\" y=\"134.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x + y = 4<\/text><text x=\"280.0\" y=\"168.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Restando: 2x − x + y − y = 7 + 4 → x = 11<\/text><\/svg>","o":["Al restar las ecuaciones sumó los lados derechos: debió calcular 7 − 4 = 3","Sumó las ecuaciones en lugar de restarlas antes de eliminar la incógnita","Eliminó la incógnita x en lugar de la incógnita y en el sistema completo","Multiplicó una de las ecuaciones por dos antes de operar con la otra","Despejó y de la primera ecuación y la reemplazó en la misma ecuación"],"s":"Argumentar","e":"Al restar las ecuaciones sumó los lados derechos: debió calcular 7 − 4 = 3."},{"q":"¿Cuál es la forma reducida de la expresión de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Reduce la expresión: (3x + 5y) − (8x − 2y − 4) + 3(x + y + 1)\"><rect width=\"560\" height=\" rif\">Sustituyendo: 3x + 2x + 1 = 11 → 5x = 11 + 1 → x = 12/5<\/text><\/svg>","o":["Al pasar el 1 al otro lado no cambió su signo: 5x = 11 − 1 = 10, luego x = 2","Sustituyó y por 2x pero olvidó el término independiente de la primera ecuación","Reemplazó y en la primera ecuación en vez de hacerlo en la segunda ecuación","Multiplicó la segunda ecuación por 2 antes de reemplazar el valor de y","Sumó 3x y 2x y obtuvo un coeficiente que no corresponde a la suma"],"s":"Argumentar","e":"Al pasar el 1 al otro lado no cambió su signo: 5x = 11 − 1 = 10, luego x = 2."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: C(n) = 5000 + 300n C(14) = (5000 + 300)·14 = 74200\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">C(n) = 5000 + 300n<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">C(14) = (5000 + 300)·14 = 74200<\/text><\/svg>","o":["Sumó el cargo fijo al costo unitario antes de multiplicar: el cargo fijo se paga una sola vez","Multiplicó el cargo fijo por la cantidad de unidades y sumó el costo unitario","Restó el cargo fijo en lugar de sumarlo al costo variable del uso","Usó el costo por unidad como si fuera el cargo fijo de la tarifa","Reemplazó n por el cargo fijo y calculó el costo variable con ese número"],"s":"Argumentar","e":"Sumó el cargo fijo al costo unitar ución","Multiplicó los números de los factores para obtener las soluciones","Escribió las soluciones correctas pero intercambió su orden en el resultado"],"s":"Argumentar","e":"Cambió el signo de las dos soluciones: (x − a)(x + b) = 0 tiene soluciones x = a y x = −b."},{"q":"¿Cuál es la solución (x, y) del sistema de ecuaciones de la figura?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve el sistema: −4x + y = −1 5x + 3y = 31\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resuelve el sistema:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−4x + y = −1<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">5x + 3y = 31<\/text><\/svg>","o":["(2, 7)","(7, 2)","(−2, 7)","(2, −7)","(3, 7)"],"s":"Resolver problemas","e":"Se resuelve por reducción: x = 2, y = 7."},{"q":"Se reparten $14.900 entre Sofía, Diego y Elena. Diego recibe $2.900 más que Sofía y Elena recibe el doble de lo que recibe Sofía. Sea x lo que recibe Sofía. ¿Qué ecuación permite calcular el valor de x?","svg":"<svg viewBox=\"0 0 560 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Total: $14.900 Sofía: x  ·  Diego: x + 2900 Elena: 2x\"><rect width=\"560\" height=\"180\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"130.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Total: $14.900<\/text><text x=\"280.0\" y=\"97.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sofía: x  ·  Diego: x + 2900<\/text><text x=\"280.0\" y=\"129.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Elena: 2x<\/text><\/svg>","o":["x + (x + 2900) + 2x = 14900","x + x + 2900 + 2x = 14900 · 2","x · (x + 2900) · 2x = 14900","x + (x + 2900) + x + 2 = 14900","x + (x + 2900) + 2(x + 2900) = 14900"],"s":"Modelar","e":"Se traduce cada frase del enunciado a una expresión con x y se iguala al dato total."},{"q":"¿Cuáles son las coordenadas del vértice de la parábola f(x) = −x² + 10x − 18?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Función: f(x) = −x² + 10x − 18\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Función:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = −x² + 10x − 18<\/text><\/svg>","o":["(5, 7)","(−5, 7)","(5, −7)","(10, 7)","(5, −18)"],"s":"Resolver problemas","e":"x = −b/(2a) = 5; f(5) = 7."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: Dos planes con pendientes 200 y 300 El de pendiente menor siempre es más barato\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Dos planes con pendientes 200 y 300<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">El de pendiente menor siempre es más barato<\/text><\/svg>","o":["No consideró el cargo fijo: un plan de menor pendiente puede ser más caro para poco uso","Consideró que la pendiente menor implica un cargo fijo mayor en todos los casos","Comparó los costos solo cuando el uso es cero y concluyó con ese valor","Supuso que ambas rectas se cruzan siempre en el origen del plano cartesiano","Comparó las pendientes pero olvidó que el costo depende también de n"],"s":"Argumentar","e":"No consideró el cargo fijo: un plan de menor pendiente puede ser más caro para poco uso."},{"q":"Sea f(x) = −3x² + 4x + 6. ¿Cuál es el valor de f(2)?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Función: f(x) = −3x² + 4x + 6\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Función:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = −3x² + 4x + 6<\/text><\/svg>","o":["2","26","−14","−2","50"],"s":"Resolver problemas","e":"f(2) = −3·(2)² + (4)·(2) + (6) = 2."},{"q":"Sea f(x) = −3x² − x − 4. ¿Cuál es el valor de f(1)?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Función: f(x) = −3x² − x − 4\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Función:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = −3x² − x − 4<\/text><\/svg>","o":["−8","−2","−6","4","−12"],"s":"Resolver problemas","e":"f(1) = −3·(1)² + (−1)·(1) + (−4) = −8."},{"q":"¿Cuál es el conjunto solución de la inecuación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resuelve la inecuación: 4 &lt; 4x − 4 ≤ 24\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resuelve la inecuación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">4 &lt; 4x − 4 ≤ 24<\/text><\/svg>","o":["2 < x ≤ 7","2 ≤ x < 7","2 < x ≤ 28","8 < x ≤ 28","7 < x ≤ 2"],"s":"Resolver problemas","e":"Se resta el término independiente a los tres miembros y luego se divide por el coeficiente positivo."},{"q":"¿Cuál es la factorización de la expresión de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Factoriza: t² + 6t + 8\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Factoriza:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">t² + 6t + 8<\/text><\/svg>","o":["(t + 4)(t + 2)","(t − 4)(t − 2)","(t + 4)(t − 2)","(t + 6)(t + 8)","(t + 4)(t + 3)"],"s":"Resolver problemas","e":"Se buscan dos números que sumen 6 y multipliquen 8: 4 y 2."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: y = 3x + 4 «La recta corta al eje X en 4»\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">y = 3x + 4<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">«La recta corta al eje X en 4»<\/text><\/svg>","o":["El punto (0, 4) es el corte con el eje Y: el corte con el eje X se obtiene haciendo y = 0","El corte con el eje X es 3, porque es el coeficiente de x en la ecuación","La recta corta al eje X en −4, porque se cambia el signo del término independiente","La recta no corta al eje X porque tiene pendiente positiva en toda su extensión","El corte con el eje X es 12, porque se multiplica la pendiente por n"],"s":"Argumentar","e":"El punto (0, 4) es el corte con el eje Y: el corte con el eje X se obtiene haciendo y = 0."},{"q":"¿Cuál es el valor numérico de la expresión con los valores indicados en la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Expresión: a² − b² − 2(a + b) a = 1,  b = −2\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Expresión: a² − b² − 2(a + b)<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">a = 1,  b = −2<\/text><\/svg>","o":["−1","11","−7","−5","1"],"s":"Resolver problemas","e":"Se reemplazan las letras por sus valores respetando paréntesis y signos: −1."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: f(x) = −x² + 12x «El valor máximo es 6, porque el vértice está en x = 6»\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">f(x) = −x² + 12x<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">«El valor máximo es 6, porque el vértice está en x = 6»<\/text><\/svg>","o":["Confundió la coordenada x con el valor má ) + 2a² a = −3,  b = 2\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Expresión: 6(a − 3b) + 2a²<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">a = −3,  b = 2<\/text><\/svg>","o":["−36","−6","−18","36","−34"],"s":"Resolver problemas","e":"Se reemplazan las letras por sus valores respetando paréntesis y signos: −36."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: y = 5x + 1 «La recta corta al eje X en 1»\"><rect width=\"560\" height=\"192\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"142.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"67.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"103.0\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">y = 5x + 1<\/text><text x=\"280.0\" y=\"138.5\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">«La recta corta al eje X en 1»<\/text><\/svg>","o":["El punto (0, 1) es el corte con el eje Y: el corte con el eje X se obtiene haciendo y = 0","El corte con el eje X es 5, porque es el coeficiente de x en la ecuación","La recta corta al eje X en −1, porque se cambia el signo del término independiente","La recta no corta al eje X porque tiene pendiente positiva en toda su extensión","El corte con el eje X es 5, porque se multiplica la pendiente por n"],"s":"Argumentar","e":"El punto (0, 1) es el corte con el eje Y: el corte con el eje X se obtiene haciendo y = 0."},{"q":"La altura de una pelota se modela con h(t) = −5t² + 15t (h en metros, t en segundos desde el lanzamiento). ¿Después de cuántos segundos vuelve al suelo?","svg":"<svg viewBox=\"0 0 560 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Altura de una pelota (m): h(t) = −5t² + 15t t en segundos\"><rect width=\"560\" height=\"150\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"100.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"57.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Altura de una pelota (m):<\/text><text x=\"280.0\" y=\"82.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">h(t) = −5t² + 15t<\/text><text x=\"280.0\" y=\"107.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">t en segundos<\/text><\/svg>","o":["3 s","0 s","4 s","15 s","6 s"],"s":"Modelar","e":"h(t) = 0 ⟹ 5t(−t + 3) = 0 ⟹ t = 0 (lanzamiento) o t = 3: vuelve al suelo a los 3 s."},{"q":"En una alcancía hay x monedas de $100 y 8 monedas más de $50 que de $100. En total hay $2.350. ¿Qué ecuación permite calcular el valor de x?","svg":"<svg viewBox=\"0 0 560 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Monedas de $100: x Monedas de $50: x + 8 Total: $2.350\"><rect width=\"560\" height=\"180\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"130.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Monedas de $100: x<\/text><text x=\"280.0\" y=\"97.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Monedas de $50: x + 8<\/text><text x=\"280.0\" y=\"129.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Total: $2.350<\/text><\/svg>","o":["100x + 50(x + 8) = 2350","100x + 50x + 8 = 2350","100x · 50(x + 8) = 2350","100x + 50(x − 8) = 2350","150(x + 8) = 2350"],"s":"Modelar","e":"Se traduce cada frase del enunciado a una expresión con x y se iguala al dato total."},{"q":"¿Qué tipo de modelo (lineal o cuadrático) describe mejor la situación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Situación: La altura de una pelota lanzada hacia arriba según el tiempo\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Situación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">La altura de una pelota lanzada hacia arriba según el tiempo<\/text><\/svg>","o":["Cuadrática, porque la trayectoria es una parábola","Lineal, porque la trayectoria es una parábola","Lineal, porque la situación involucra dos variables","Cuadrática, porque siempre se cumple que a mayor valor de x mayor valor de y","Ninguno, porque la situación no puede modelarse con una función"],"s":"Argumentar","e":"Se decide según cómo cambia la cantidad dependiente: variación constante (lineal) o dependencia del cuadrado (cuadrática)."},{"q":"¿Qué tipo de modelo (lineal o cuadrático) describe mejor la situación de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Situación: La temperatura convertida de grados Celsius a Fahrenheit\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Situación:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">La temperatura convertida de grados Celsius a Fahrenheit<\/text><\/svg>","o":["Lineal, porque la relación entre ambas escalas es de primer grado","Cuadrática, porque la relación entre ambas escalas es de primer grado","Cuadrática, porque la situación involucra dos variables","Lineal, porque siempre se cumple que a mayor valor de x mayor valor de y","Ninguno, porque la situación no puede modelarse con una función"],"s":"Argumentar","e":"Se decide según cómo cambia la cantidad dependiente: variación constante (lineal) o dependencia del cuadrado (cuadrática)."},{"q":"Una cancha cuadrada de lado x metros está rodeado por una franja de pasto de 9 metros de ancho. ¿Qué expresión representa el área total (incluida la superficie del franja)?","svg":"<svg viewBox=\"0 0 560 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Jardín cuadrado rodeado de un camino\"><rect width=\"560\" height=\"330\" fill=\"#FFFFFF\"/><rect x=\"100.0\" y=\"30.0\" width=\"280.0\" height=\"280.0\" fill=\"#FEF3C7\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><rect x=\"140.0\" y=\"70.0\" width=\"200.0\" height=\"200.0\" fill=\"#DBEAFE\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"240.0\" y=\"175.0\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">x<\/text><rect x=\"107.3\" y=\"46.5\" width=\"25.3\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"120.0\" y=\"65.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">9<\/text><rect x=\"204.1\" y=\"36.5\" width=\"71.8\" height=\"27\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#0B3D6E\" stroke-width=\"1.5\"/><text x=\"240.0\" y=\"55.2\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">camino<\/text><\/svg>","o":["x² + 36x + 324","x² + 18","x² + 81","x² + 18x + 81","x² + 18x"],"s":"Modelar","e":"El lado total es x + 18: área = (x + 18)² = x² + 36x + 324."},{"q":"Con un presupuesto de $20.000 se compra una matrícula de $3.000 y n clases de $1.000 cada una. ¿Qué inecuación representa la situación?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Presupuesto: $20.000 Matrícula: $3.000 (una vez) Cada clase: $1.000\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Presupuesto: $20.000<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Matrícula: $3.000 (una vez)<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Cada clase: $1.000<\/text><\/svg>","o":["3000 + 1000n ≤ 20000","3000 + 1000n ≥ 20000","4000n ≤ 20000","3000n + 1000 ≤ 20000","3000 + 1000n < 17000"],"s":"Modelar","e":"El gasto total (fijo + variable) no puede superar el presupuesto."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 148\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: 6x + 12 = 3(2x + 4)\"><rect width=\"560\" height=\"148\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"98.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.7\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"97.3\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">6x + 12 = 3(2x + 4)<\/text><\/svg>","o":["No extrajo el máximo factor común: se puede factorizar 6 y queda 6(x + 2)","Extrajo un factor que no divide a ninguno de los dos términos de la expresión","Extrajo el factor común pero dejó los términos sin dividir por él","Factorizó la variable x pero no el coeficiente numérico común de los términos","Sumó los coeficientes en lugar de buscar su máximo divisor común"],"s":"Argumentar","e":"No extrajo el máximo factor común: se puede factorizar 6 y queda 6(x + 2)."},{"q":"El plan A cobra $100 fijos más $400 por unidad usada y el plan B cobra $1.900 fijos más $200 por unidad. Si se usarán 8 unidades, ¿qué plan conviene?","svg":"<svg viewBox=\"0 0 560 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Plan A: $100 + $400 por unidad Plan B: $1.900 + $200 por unidad Uso previsto: 8 unidades\"><rect width=\"560\" height=\"170\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"120.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"62.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan A: $100 + $400 por unidad<\/text><text x=\"280.0\" y=\"92.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Plan B: $1.900 + $200 por unidad<\/text><text x=\"280.0\" y=\"122.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Uso previsto: 8 unidades<\/text><\/svg>","o":["Plan A, porque su costo con 8 unidades es menor","Plan B, porque su costo con 8 unidades es menor","Plan A, porque su costo fijo es menor","Plan B, porque su precio por unidad es menor siempre","Ambos cuestan lo mismo con esa cantidad de unidades"],"s":"Modelar","e":"Costo A = $3.300 y costo B = $3.500 con 8 unidades: conviene el plan A."},{"q":"¿Cuál es la factorización de la expresión de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Factoriza: −12n³ + 9n²\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Factoriza:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−12n³ + 9n²<\/text><\/svg>","o":["3n²(−4n + 3)","3n(−4n² + 3n)","3(−4n³ + 3n²)","n²(−12n + 9)","3n²(−4n − 3)"],"s":"Resolver problemas","e":"Se extrae el máximo factor común de todos los términos (coeficiente y parte literal)."},{"q":"¿Cuál es el desarrollo del producto notable de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Desarrolla: (2x + 6)(2x − 6)\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Desarrolla:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(2x + 6)(2x − 6)<\/text><\/svg>","o":["4x² − 36","4x² + 36","2x² − 36","4x² − 24x + 36","4x² + 24x + 36"],"s":"Resolver problemas","e":"(a + b)(a − b) = a² − b²: 4x² − 36."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: −5x · (−7x) = −35x²\"><rect width=\"560\" height=\"120\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"70.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"55.3\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"78.7\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">−5x · (−7x) = −35x²<\/text><\/svg>","o":["Multiplicó dos negativos y obtuvo negativo: el producto de dos negativos es positivo","Sumó los coeficientes en lugar de multiplicarlos entre sí en el producto","Restó los exponentes en lugar de sumarlos al multiplicar las potencias","Multiplicó los coeficientes pero perdió una de las variables al final","Aplicó la regla de los signos de la suma a un producto de monomios"],"s":"Argumentar","e":"Multiplicó dos negativos y obtuvo negativo: el producto de dos negativos es positivo."},{"q":"Se reparten $21.300 entre Sofía, Diego y Elena. Diego recibe $2.500 más que Sofía y Elena recibe el doble de lo que recibe Sofía. Sea x lo que recibe Sofía. ¿Qué ecuación permite calcular el valor de x?","svg":"<svg viewBox=\"0 0 560 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Total: $21.300 Sofía: x  ·  Diego: x + 2500 Elena: 2x\"><rect width=\"560\" height=\"180\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"130.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Total: $21.300<\/text><text x=\"280.0\" y=\"97.0\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Sofía: x  ·  Diego: x + 2500<\/text><text x=\"280.0\" y=\"129.5\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Elena: 2x<\/text><\/svg>","o":["x + (x + 2500) + 2x = 21300","x + x + 2500 + 2x = 21300 · 2","x · (x + 2500) · 2x = 21300","x + (x + 2500) + x + 2 = 21300","x + (x + 2500) + 2(x + 2500) = 21300"],"s":"Modelar","e":"Se traduce cada frase del enunciado a una expresión con x y se iguala al dato total."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 120\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: (x + 6)² = x² + 36\"><rect width=\"560\" height=\"120\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"70.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"55.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Resolución de un estudiante:<\/text><text x=\"280.0\" y=\"78.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">(x + 6)² = x² + 36<\/text><\/svg>","o":["Elevó al cuadrado cada término y omitió el doble producto: (x + a)² = x² + 2ax + a²","Multiplicó el binomio por 6 en lugar de elevarlo al cuadrado completo","Elevó al cuadrado solo el segundo término y dejó la variable sin elevar","Sumó los cuadrados y luego los multiplicó por dos .0\" y=\"57.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Altura de una pelota (m):<\/text><text x=\"280.0\" y=\"82.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">h(t) = −5t² + 30t<\/text><text x=\"280.0\" y=\"107.0\" font-size=\"21\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">t en segundos<\/text><\/svg>","o":["6 s","0 s","3 s","30 s","7 s"],"s":"Modelar","e":"h(t) = 0 ⟹ 5t(−t + 6) = 0 ⟹ t = 0 (lanzamiento) o t = 6: vuelve al suelo a los 6 s."},{"q":"¿Cuál es la factorización de la expresión de la figura?","svg":"<svg viewBox=\"0 0 560 130\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Factoriza: m² + 14m + 49\"><rect width=\"560\" height=\"130\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"80.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"58.7\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">Factoriza:<\/text><text x=\"280.0\" y=\"85.3\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0F172A\" font-family=\"Arial,Helvetica,sans-serif\">m² + 14m + 49<\/text><\/svg>","o":["(m + 7)²","(m − 7)²","(m + 7)(m − 7)","(m + 49)²","(m + 14)(m + 7)"],"s":"Resolver problemas","e":"Trinomio cuadrado perfecto: a² ± 2ab + b² = (a ± b)²."},{"q":"Observa la resolución de la figura. ¿Qué error cometió el estudiante?","svg":"<svg viewBox=\"0 0 560 148\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Resolución de un estudiante: (x + 4)(x − 4) = x² + 16\"><rect width=\"560\" height=\"148\" fill=\"#FFFFFF\"/><rect x=\"30.0\" y=\"25.0\" width=\"500.0\" height=\"98.0\" fill=\"#F1F5F9\" stroke=\"#0B3D6E\" stroke-width=\"3\"/><text x=\"280.0\" y=\"64.7\" font-size=\"20\" font-weight=\"700\" tex const MAX_GAP=16;
const SKILLS=["Resolver problemas","Modelar","Representar","Argumentar"];
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
// Validación en el navegador: 5 opciones únicas y correcta <= distractor más largo + 16.
function valid(q){
  if(!q||!Array.isArray(q.o)||q.o.length!==5||new Set(q.o).size!==5)return false;
  const longest=Math.max(...q.o.slice(1).map(s=>[...s].length));
  return [...q.o[0]].length-longest<=MAX_GAP;
}
const GOOD=BANK.filter(valid);
if(GOOD.length!==BANK.length)console.warn("Preguntas descartadas por validación:",BANK.length-GOOD.length);
function pick(){
  const base=Math.floor(CFG.n/SKILLS.length), extra=CFG.n%SKILLS.length, out=[];
  // Las preguntas sobrantes (p. ej. 10 = 3+3+2+2) se reparten al azar entre las habilidades.
  shuffle(SKILLS).forEach((s,i)=>{
    const pool=shuffle(GOOD.filter(q=>q.s===s));
    out.push(...pool.slice(0,base+(i<extra?1:0)));
  });
  // Si algún eje quedó corto, completa desde el resto del banco.
  if(out.length<CFG.n){const rest=shuffle(GOOD.filter(q=>!out.includes(q)));out.push(...rest.slice(0,CFG.n-out.length))}
  // >= 90% con imagen: reemplaza sin imagen por otras con imagen si hiciera falta.
  const need=Math.ceil(CFG.n*0.9);
  while(out.filter(q=>q.svg).length<need){
    const i=out.findIndex(q=>!q.svg);const alt=shuffle(GOOD.filter(q=>q.svg&&!out.includes(q)))[0];
    if(i<0||!alt)break;out[i]=alt;
  }
  return shuffle(out);
}
function prepare(q){
  // Baraja las opciones; evita rachas de 3 letras iguales en la correcta.
  return {...q,ord:shuffle([0,1,2,3,4])};
}
function build(){
  for(let t=0;t<200;t++){
    const qs=pick().map(prepare);
    const pos=qs.map(q=>q.ord.indexOf(0));
    const run=pos.some((p,i)=>i>1&&p===pos[i-1]&&p===pos[i-2]);
    const cnt=[0,0,0,0,0];pos.forEach(p=>cnt[p]++);
    if(!run&&Math.max(...cnt)<=Math.ceil(CFG.n/5)+1)return qs;
  }
  return pick().map(prepare);
}
let Q,idx,score,answers,t0,timer;
const $=id=>document.getElementById(id);
function start(){
  Q=build();idx=0;score=0;answers=[];t0=Date.now();
  clearInterval(timer);timer=setInterval(tick,1000);render();
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$("meta").textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+"  ·  "+Math.min(idx+1,Q.length)+"/"+Q.length}
function render(){
  tick();$("bar").style.width=(idx/Q.length*100)+"%";
  const q=Q[idx],app=$("app");
  app.innerHTML="";
  const sk=document.createElement("span");sk.className="skill";sk.textContent="Habilidad: "+q.s;app.append(sk);
  const st=document.createElement("div");st.className="stem";st.textContent=(idx+1)+". "+q.q;app.append(st);
  if(q.svg){const f=document.createElement("div");f.className="fig";f.innerHTML=q.svg;app.append(f)}
  const box=document.createElement("div");box.className="opts";
  q.ord.forEach((k,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";
    const l=document.createElement("b");l.textContent="ABCDE"[i];const t=document.createElement("span");t.textContent=q.o[k];
    b.append(l,t);b.onclick=()=>answer(i,box,b);box.append(b);
  });
  app.append(box);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";app.append(fb);
}
function answer(i,box,btn){
  const q=Q[idx],good=q.ord.indexOf(0),ok=i===good;
  [...box.children].forEach((b,j)=>{b.disabled=true;if(j===good)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
  if(ok)score++;answers.push({q,ok,pick:i});
  const fb=$("fb");fb.style.display="block";
  fb.innerHTML="";const h=document.createElement("b");h.className=ok?"tag-ok":"tag-bad";h.textContent=ok?"¡Correcto! ":"Incorrecto. ";
  fb.append(h,document.createTextNode(q.e));
  const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=idx===Q.length-1?"Ver resultados":"Siguiente →";
  nx.onclick=()=>{idx++;idx>=Q.length?finish():render()};$("app").append(nx);nx.focus();
}
function finish(){
  clearInterval(timer);$("bar").style.width="100%";
  const s=Math.floor((Date.now()-t0)/1000),app=$("app");
  const by={};SKILLS.forEach(k=>by[k]=[0,0]);answers.forEach(a=>{by[a.q.s][1]++;if(a.ok)by[a.q.s][0]++});
  app.innerHTML="";
  const h=document.createElement("div");h.innerHTML='<div class="big"></div><p></p>';
  h.firstChild.textContent=score+" / "+Q.length;h.lastChild.textContent="Porcentaje de logro: "+Math.round(score/Q.length*100)+"%  ·  Tiempo: "+Math.floor(s/60)+" min "+(s%60)+" s";
  app.append(h);
  const tb=document.createElement("table");tb.innerHTML="<tr><th>Habilidad PAES</th><th>Correctas</th></tr>";
  SKILLS.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td></td>";tr.children[0].textContent=k;tr.children[1].textContent=by[k][0]+" / "+by[k][1];tb.append(tr)});
  app.append(tb);
  answers.forEach((a,n)=>{
    const d=document.createElement("div");d.className="rev";
    const t=document.createElement("div");t.innerHTML='<b></b> <span></span>';
    t.firstChild.className=a.ok?"tag-ok":"tag-bad";t.firstChild.textContent=(n+1)+(a.ok?" ✔":" ✘");t.lastChild.textContent=a.q.q;d.append(t);
    if(a.q.svg){const f=document.createElement("div");f.className="fig";f.style.maxWidth="420px";f.style.marginTop="8px";f.innerHTML=a.q.svg;d.append(f)}
    const c=document.createElement("div");c.textContent="Respuesta correcta: "+a.q.o[0]+". "+a.q.e;d.append(c);app.append(d);
  });
  const b=document.createElement("button");b.className="btn";b.textContent="Nuevo intento (otras preguntas)";b.onclick=start;app.append(b);
  window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{const o=document.querySelectorAll(".opt:not(:disabled)");if(o.length&&"12345".includes(e.key))o[+e.key-1]?.click();else if(e.key==="Enter"){const n=document.querySelector(".btn");n&&n.click()}});
start();
</script>
</body>
</html>
